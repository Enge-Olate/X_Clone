{% extends 'base.html' %}
{% block content %}
<div class="max-w-sm mx-auto mt-20 p-8">
  <h1 class="text-3xl font-bold mb-6">Entrar no X</h1>

  {% if error %}
    <p class="text-red-500 text-sm mb-4">{{ error }}</p>
  {% endif %}

  <form method="post" action="{% url 'auth-login' %}" class="space-y-4">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Usuário" required
           class="w-full bg-transparent border border-border rounded-md p-3 outline-none focus:border-x-blue" />
    <input type="password" name="password" placeholder="Senha" required
           class="w-full bg-transparent border border-border rounded-md p-3 outline-none focus:border-x-blue" />
    <button type="submit"
            class="w-full bg-white text-black border border-black hover:bg-blue-500 hover:text-white hover:border-none font-bold py-3 rounded-full transition-colors duration-200">
      Entrar
    </button>
  </form>

  <p class="text-ink-muted text-sm mt-6">
    Não tem conta?
    <a href="{% url 'auth-register' %}" class="text-x-blue">Cadastre-se</a>
  </p>
</div>
{% endblock %}
