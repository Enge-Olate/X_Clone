<button hx-post="{% url 'follow-toggle' profile.user.username %}"
        hx-target="this"
        hx-swap="outerHTML"
        class="px-4 h-8 rounded-full font-bold text-[14px]
               {% if profile in request.user.profile.following.all %}
                 bg-transparent border border-border hover:border-red-500 hover:text-red-500
               {% else %}
                 bg-ink text-black hover:bg-ink/90
               {% endif %}">
  {% if profile in request.user.profile.following.all %}Seguindo{% else %}Seguir{% endif %}
</button>
